name: Hindi YouTube AI Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  start-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow gTTS google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Generate Story, Hindi Voice and MP4 Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python agent.py

      - name: Save Generated Files
        uses: actions/upload-artifact@v4
        with:
          name: golu-sonu-cartoon-video
          path: |
            video_script.txt
            narration.mp3
            golu_sonu_cartoon.mp4
